[project]
name = "lfm-diffusion"
version = "0.1.0"
description = "Inference and evaluation for Liquid AI LFM2.5 block-diffusion language models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.6",
    "transformers>=5.8",
    "huggingface_hub>=0.30",
    "safetensors",
    "pyyaml",
]

[project.optional-dependencies]
cuda = ["torch>=2.6"]
rocm = ["torch>=2.6", "pytorch-triton-rocm"]
eval = ["lm-eval[api]>=0.4.8"]

[tool.uv]
conflicts = [[{ extra = "cuda" }, { extra = "rocm" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", extra = "cuda" },
    { index = "pytorch-rocm", extra = "rocm" },
]
pytorch-triton-rocm = [{ index = "pytorch-rocm", extra = "rocm" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.4"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lfm_diffusion"]
